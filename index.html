<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Houses</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="logo-title">
            <h1>Lifestyle Properties</h1>
        </header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Properties</a></li>
                <li><a href="#">Lifestyle</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
        <section class="hero">
            <h2>Lifestyle House</h2>
            <p>Finest Houses In The Eastern Cape!</p>
            <button class="btn">View</button>
        </section>
        <form class="form-group">
        <fieldset>
            <legend>Fill In Form</legend>
            <label for="name">Name</label>
            <input id="name" type="text" name="user_name">
            <label for="surname">Last Name</label>
            <input id="surname" type="text" name="user_lastname">
            <label for="email">Email</label>
            <input id="email" type="email" name="user_email">
            <fieldset>
                <label for="employed">Employed</label>
                <input id="employed" type="radio" name="employment">
                <label for="self-employed">Self-Employed</label>
                <input id="self-employed" type="radio" name="employment">
            </fieldset>
            <button class="submit-btn" type="submit">Submit</button>
        </fieldset>
        </form>
    </body>
</html>
